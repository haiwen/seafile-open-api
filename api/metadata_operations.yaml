openapi: 3.0.3
info:
  title: Metadata Operations - User
  description: |-
    The official Seafile API Reference (OpenAPI 3.0). - Part 'User Metadata Operations'.
  version: '13.0'
servers:
  - url: https://{server}
    variables: 
      server:
        default: cloud.seafile.com

x-readme:
  explorer-enabled: true
  metrics-enabled: false
  proxy-enabled: false

components:
  securitySchemes:
    AccountTokenAuth:
      type: http
      scheme: bearer
      description: This is the [Account-Token](/reference/authentication).

  # Reusable path, query, header and cookie parameters
  parameters:
    # Query parameters
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
      example: 1
    
    view_id:
      name: view_id
      in: query
      required: true
      description: The unique view identifier of the current metadata
      schema: 
        type: integer
    
    start: 
      name: start
      in: query
      required: false
      schema: 
        type: integer
        default: 0

    limit: 
      name: limit
      in: query
      required: false
      schema: 
        type: integer
        default: 1000

    parent_dir:
      name: parent_dir
      in: query
      description: 'Path to the parent_dir'
      required: true
      schema:
        type: string

    file_name:
      name: file_name
      in: query
      required: true
      description: 'filename'
      schema:
        type: string


    # Path parameters
    repo_id:
      name: repo_id
      in: path
      description: The unique identifier of a library
      example: 90c4e9c2-ca5f-4881-8453-164d8b819f6f
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12}$'

    view_id_path:
      name: view_id
      in: path
      required: true
      description: The unique view identifier of the current metadata
      schema: 
        type: integer

    link_token: 
      name: link_token
      in: path
      required: true
      description: Token for sharing links
      example: 2408d25117b74e46bd41
      schema: 
        type: string
    
    tag_id: 
      name: tag_id
      in: path
      description: The unique identifier of a Tag
      example: KvfhV8GpQPWEskVxBtwePA
      required: true
      schema: 
        type: string
    
    people_id:
      name: people_id
      in: path
      description: The unique identifier of a people photo
      example: BSeC48UiQGSmSY-BAOZc8g
      required: true
      schema: 
        type: string
    
  schemas:
    # request body
    view_id: 
      type: string
      description: The unique view identifier of the current metadata
      example: nc5t

    group_name: 
      title: name
      description: Group name
      type: string
      example: 'test'
    
    row:
      type: object
      title: Row
      description: |
        Pass the set of column names and their values. The column names must be present in your table. Different column types require different ways to input values. For eg:
        {"Name":"Max", "Age":"21", "Birthday":"2023-02-18", "Checkbox":"true"}
      example:
        Name: "Max"
        Age: 18
        Birthday: "2025-06-18"
        Checkbox: true

paths:
  /api/v2.1/repos/{repo_id}/metadata/:
    get:
      tags:
        - Metadata config
      summary: Get metadata enabled status
      description: Returns the enabled status of metadata and the status of metadata tags for the library.
      security:
        - AccountTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/repo_id'
      responses:
          '200':
            description: OK
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    enabled:
                            type: boolean
                    tags_enabled:
                            type: boolean
                    tags_lang:
                            type: string
                    details_settings:
                            type: string
                    ocr_enabled:
                            type: boolean
                example: {
                      "enabled": false,
                      "tags_enabled": false,
                      "tags_lang": "",
                      "details_settings": "{}",
                      "ocr_enabled": false
                  }
    put: 
      tags:
        - Metadata config
      summary: Enabled metadata
      description: Enabled metadata for a library.
      security:
        - AccountTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/repo_id'
      responses:
          '200':
            description: OK
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    success: 
                      type: boolean
                      description: Success state
    delete: 
      tags:
        - Metadata config
      summary: Disable metadata
      description: Disable metadata for a library.
      security:
        - AccountTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/repo_id'
      responses:
          '200':
            description: OK
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    success: 
                      type: boolean
                      description: Success state


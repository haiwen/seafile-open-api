  /api/v2.1/repos/{repo_id}/metadata/columns/:
    post: 
      tags:
        - Metadata records
      summary: Add column
      description: Create a new non repeating column.
      security:
        - AccountTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/repo_id'
      requestBody:
        content:
          application/json: 
            schema: 
              type: object
              properties:
                column_name: 
                  type: string
                  description: Name of column
                column_type: 
                  type: string
                  description: Type of column
                column_key: 
                  type: string
                  description: Key of column
                column_data: 
                  type: string
                  description: Data of column 
              required:
                - column_name
      responses:
          '200':
            description: OK
            content:
              application/json:
                schema: 
                  type: object
                  properties:
                    column: 
                      type: object
                      properties:
                        key: 
                          type: string
                          example: afdsxax
                        name: 
                          type: string
                          example: column_name
                        type: 
                          type: string
                          example: text
